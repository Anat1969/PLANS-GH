# הפקת מודל אוטומטית (ענת, 23.11.2026): כל 3 שעות, וגם בלחיצה (Actions > auto-model > Run workflow).
# מוצא בענן העירייה (ASHDODMAP, קריאה בלבד) תוכניות עם PDF עם שכבות מהטופס לאדריכל, ומפיק להן מודל ב-layers/<תיק>.
# שומר ל-main רק קבצי נתונים תחת layers/. כשאין PDF חדש, לא נוצר commit.
name: auto-model
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'להפיק מחדש גם מודלים קיימים'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: auto-model
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pymupdf pillow numpy scipy opencv-python-headless
      - run: python3 tools/auto-model.py --all ${{ inputs.force && '--force' || '' }}
      - run: node tools/check-auto.js
      - name: שמירה
        run: |
          git add layers/
          if git diff --cached --quiet; then echo "אין מודל חדש"; exit 0; fi
          git -c user.name="auto-model" -c user.email="auto-model@users.noreply.github.com" commit -m "מודל אוטומטי מתוכנית פיתוח שהגיעה בטופס לאדריכל"
          git push
